<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="宅地建物取引士試験のアクティブリコール暗記カード">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宅建リコール">
<link rel="manifest" href="manifest.json">
<title>宅建 アクティブリコール</title>
<style>
  :root {
    --primary: #2563eb; --bg: #f8fafc; --card-bg: #fff; --text: #1e293b;
    --muted: #64748b; --border: #e2e8f0;
    --maru: #16a34a; --sankaku: #d97706; --batsu: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --card-bg: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --primary: #60a5fa; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", Arial, sans-serif;
    background: var(--bg); color: var(--text); margin: 0; padding: 0 0 80px; line-height: 1.55;
  }
  .wrap, .container { max-width: 820px; margin: 0 auto; }
  .container { padding: 14px 14px 0; }

  header.top {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 9px 14px 8px;
    padding-top: max(9px, env(safe-area-inset-top));
  }
  .title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  h1 { font-size: .98rem; margin: 0; color: var(--primary); }
  .rate { font-size: .74rem; color: var(--muted); }
  .rate b { font-size: .92rem; color: var(--text); }

  .subj-tabs { display: flex; gap: 6px; margin: 9px 0 8px; overflow-x: auto; scrollbar-width: none; }
  .subj-tabs::-webkit-scrollbar { display: none; }
  .subj-tabs button {
    flex: 1 0 auto; border: 1px solid var(--border); background: var(--card-bg); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: .77rem; font-weight: 700; cursor: pointer;
    white-space: nowrap; line-height: 1.3; font-family: inherit;
  }
  .subj-tabs button .n { display: block; font-size: .64rem; font-weight: 600; opacity: .8; }
  .subj-tabs button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  .bar { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; display: flex; }
  .bar span { height: 100%; transition: width .3s ease; }
  .s-maru { background: var(--maru); } .s-sankaku { background: var(--sankaku); } .s-batsu { background: var(--batsu); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: .7rem; color: var(--muted); margin-top: 6px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; margin-right: 4px; vertical-align: middle; }

  .searchbox { position: relative; margin: 14px 0 10px; }
  .searchbox input {
    width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg);
    padding: 10px 34px 10px 13px; font-size: .9rem; color: var(--text); font-family: inherit;
  }
  .searchbox .clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none;
    background: transparent; color: var(--muted); font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
  }

  .unit-picker { position: relative; margin-bottom: 10px; }
  select.unit-select {
    width: 100%; appearance: none; -webkit-appearance: none; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 38px 12px 13px;
    font-size: .92rem; font-weight: 700; color: var(--text); font-family: inherit;
  }
  .unit-picker::after { content: '▾'; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

  .seg { display: flex; background: var(--border); border-radius: 9px; padding: 3px; margin-bottom: 9px; }
  .seg button { flex: 1; border: none; background: transparent; padding: 8px 2px; border-radius: 7px;
    font-size: .78rem; font-weight: 700; color: var(--muted); cursor: pointer; font-family: inherit; }
  .seg button.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  .seg button .badge { font-size: .68rem; opacity: .85; }

  .toolbar { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn-plain { border: 1px solid var(--border); background: var(--card-bg); color: var(--muted);
    border-radius: 9px; padding: 7px 11px; font-size: .76rem; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .btn-plain.on { border-color: var(--primary); color: var(--primary); font-weight: 700; }
  .unit-nav { display: flex; gap: 8px; margin: 4px 0 20px; }
  .unit-nav button { flex: 1; text-align: center; }

  .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 13px;
    box-shadow: 0 1px 3px rgba(0,0,0,.07); border: 1px solid var(--border); border-left: 4px solid var(--border); }
  .card[data-status="maru"] { border-left-color: var(--maru); }
  .card[data-status="sankaku"] { border-left-color: var(--sankaku); }
  .card[data-status="batsu"] { border-left-color: var(--batsu); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .keyword { font-weight: 700; font-size: .99rem; }
  .unit-tag { font-size: .68rem; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .btn-show { background: var(--bg); border: 1px solid var(--border); padding: 6px 11px; border-radius: 6px;
    cursor: pointer; font-size: .79rem; font-weight: 700; color: var(--text); flex-shrink: 0; font-family: inherit; }
  .answer { background: color-mix(in srgb, var(--primary) 8%, transparent); border-left: 4px solid var(--primary);
    padding: 11px 13px; border-radius: 0 8px 8px 0; margin: 12px 0 0; font-size: .91rem; }
  .answer ul { margin: 0; padding-left: 19px; }
  .answer li { margin-bottom: 5px; } .answer li:last-child { margin-bottom: 0; }
  .trap { margin-top: 10px; font-size: .8rem; color: #b45309; background: color-mix(in srgb, var(--sankaku) 12%, transparent);
    border-radius: 6px; padding: 8px 10px; }
  @media (prefers-color-scheme: dark) { .trap { color: #fbbf24; } }
  .btn-group { display: flex; gap: 8px; margin-top: 12px; }
  .status-btn { flex: 1; padding: 9px 0; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card-bg); cursor: pointer; font-weight: 700; font-size: .86rem; transition: all .15s; font-family: inherit; }
  .status-btn.maru { color: var(--maru); } .status-btn.sankaku { color: var(--sankaku); } .status-btn.batsu { color: var(--batsu); }
  .status-btn.maru.active { background: var(--maru); color: #fff; border-color: var(--maru); }
  .status-btn.sankaku.active { background: var(--sankaku); color: #fff; border-color: var(--sankaku); }
  .status-btn.batsu.active { background: var(--batsu); color: #fff; border-color: var(--batsu); }
  .next-due { font-size: .7rem; color: var(--muted); margin-top: 8px; text-align: right; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .empty { text-align: center; color: var(--muted); font-size: .89rem; padding: 40px 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%,20px); background: #0f172a; color: #fff;
    font-size: .81rem; padding: 9px 16px; border-radius: 99px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 40; }
  .toast.show { opacity: 1; transform: translate(-50%,0); }
  .ver { text-align: center; font-size: .68rem; color: var(--muted); padding: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>宅建 アクティブリコール</h1>
      <span class="rate">全体 <b id="ovRate">–</b>／科目 <b id="subjRate">–</b></span>
    </div>
    <div class="subj-tabs" id="subjTabs"></div>
    <div class="bar">
      <span class="s-maru" id="barMaru" style="width:0%"></span>
      <span class="s-sankaku" id="barSankaku" style="width:0%"></span>
      <span class="s-batsu" id="barBatsu" style="width:0%"></span>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--maru)"></i>即答 <b id="cMaru">0</b></span>
      <span><i class="dot" style="background:var(--sankaku)"></i>迷った <b id="cSankaku">0</b></span>
      <span><i class="dot" style="background:var(--batsu)"></i>不可 <b id="cBatsu">0</b></span>
      <span><i class="dot" style="background:var(--border)"></i>未着手 <b id="cNone">0</b></span>
    </div>
  </div>
</header>

<div class="container">
  <div class="searchbox">
    <input type="search" id="search" placeholder="全科目からキーワード検索（例：2週間、正当事由）" autocomplete="off">
    <button class="clear" id="btnClear" aria-label="検索をクリア" style="display:none">×</button>
  </div>

  <div class="unit-picker"><select class="unit-select" id="unitSelect"></select></div>

  <div class="seg" id="filterSeg">
    <button class="active" data-filter="all">すべて</button>
    <button data-filter="due">今日やる <span class="badge" id="dueCount"></span></button>
    <button data-filter="weak">苦手だけ</button>
  </div>

  <div class="toolbar">
    <button class="btn-plain" id="btnShuffle">🔀 順番をシャッフル</button>
    <button class="btn-plain" id="btnBackup">⬇ バックアップ</button>
    <button class="btn-plain" id="btnRestore">⬆ 復元</button>
    <button class="btn-plain" id="btnReset">記録を消す</button>
    <input type="file" id="fileInput" accept="application/json" style="display:none">
  </div>

  <div id="cardList"></div>
  <div class="empty" id="emptyMsg" style="display:none"></div>

  <div class="unit-nav">
    <button class="btn-plain" id="btnPrev">← 前の単元</button>
    <button class="btn-plain" id="btnNext">次の単元 →</button>
  </div>
  <div class="ver" id="verLabel"></div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
/* ==========================================================================
   宅建 アクティブリコール
   - 問題データは data.js（TAKKEN_DATA）にあります。カードの追加・修正はそちらで。
   - 保存先は自動判定：Claudeのアーティファクト内では window.storage、
     通常のWebページ（GitHub Pages等）では localStorage を使います。
   ========================================================================== */
const APP_VERSION = '3.0';
const STORAGE_KEY = 'takken-recall-v3';
const PREF_KEY    = 'takken-recall-pref';

/* --- 保存レイヤー（Claude / 通常Web 両対応） --- */
const store = (() => {
  const claude = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  return {
    mode: claude ? 'claude' : 'local',
    async get(k) {
      if (claude) { try { const r = await window.storage.get(k); return r && r.value ? r.value : null; } catch (e) { return null; } }
      try { return localStorage.getItem(k); } catch (e) { return null; }
    },
    async set(k, v) {
      if (claude) { try { await window.storage.set(k, v); return true; } catch (e) { return false; } }
      try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
    },
    async del(k) {
      if (claude) { try { await window.storage.delete(k); return true; } catch (e) { return false; } }
      try { localStorage.removeItem(k); return true; } catch (e) { return false; }
    }
  };
})();

/* --- 間隔復習の間隔（日数）。ここを変えれば復習ペースを調整できます --- */
const INTERVALS = { batsu: 1, sankaku: 3, maru: [7, 14, 30, 60] };

(function () {
  const LABELS = [['maru', '◯ 即答'], ['sankaku', '△ 迷った'], ['batsu', '✕ 不可']];
  const SUBJECTS = TAKKEN_DATA;

  let rec = {};            // { cardId: { s:'maru', d:'2026-08-18', n:2 } }
  let filter = 'all';
  let subjIdx = 0, unitIdx = 0;   // unitIdx -1 = この科目の苦手を総復習
  let shuffle = false, query = '';
  const opened = new Set();
  let order = {};

  const $ = id => document.getElementById(id);
  const listEl = $('cardList'), emptyEl = $('emptyMsg'), selEl = $('unitSelect'), tabsEl = $('subjTabs');

  SUBJECTS.forEach(s => { s.all = s.units.flatMap((u, ui) => u.cards.map(c => Object.assign({}, c, { unitName: u.unit, ui, subj: s.subject }))); });
  const everyCard = SUBJECTS.flatMap(s => s.all);

  const today = () => new Date().toLocaleDateString('sv-SE');
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv-SE'); };
  const statusOf = id => (rec[id] && rec[id].s) || null;
  const isDue = c => { const r = rec[c.id]; return !r || !r.d || r.d <= today(); };

  /* --- 科目タブ --- */
  SUBJECTS.forEach((s, i) => {
    const b = document.createElement('button');
    b.innerHTML = s.subject + '<span class="n">0/' + s.all.length + '</span>';
    b.addEventListener('click', () => { subjIdx = i; unitIdx = 0; buildUnitSelect(); render(); savePref(); scrollTop(); });
    tabsEl.appendChild(b);
  });

  function buildUnitSelect() {
    selEl.innerHTML = '';
    SUBJECTS[subjIdx].units.forEach((u, i) => {
      const o = document.createElement('option'); o.value = i; o.textContent = u.unit; selEl.appendChild(o);
    });
    const o = document.createElement('option'); o.value = -1; o.textContent = '★ この科目の苦手を総復習'; selEl.appendChild(o);
    selEl.value = String(unitIdx);
  }
  selEl.addEventListener('change', () => { unitIdx = parseInt(selEl.value, 10); render(); savePref(); scrollTop(); });
  const scrollTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  /* --- カード生成 --- */
  function cardNode(c, showUnit) {
    const el = document.createElement('div');
    el.className = 'card';
    const st = statusOf(c.id);
    if (st) el.dataset.status = st;

    const head = document.createElement('div');
    head.className = 'card-header';
    const kw = document.createElement('div');
    kw.innerHTML = (showUnit ? '<div class="unit-tag">' + (query ? c.subj + '｜' : '') + c.unitName + '</div>' : '') +
                   '<div class="keyword">' + c.q + '</div>';
    const show = document.createElement('button');
    show.className = 'btn-show';
    show.textContent = opened.has(c.id) ? '解答を隠す' : '解答表示';
    head.append(kw, show); el.appendChild(head);

    const ans = document.createElement('div');
    ans.className = 'answer';
    ans.innerHTML = '<ul>' + c.a.map(x => '<li>' + x + '</li>').join('') + '</ul>' +
                    (c.trap ? '<div class="trap"><b>ひっかけ：</b>' + c.trap + '</div>' : '');
    ans.style.display = opened.has(c.id) ? 'block' : 'none';
    el.appendChild(ans);
    show.addEventListener('click', () => {
      const open = ans.style.display === 'none';
      ans.style.display = open ? 'block' : 'none';
      show.textContent = open ? '解答を隠す' : '解答表示';
      open ? opened.add(c.id) : opened.delete(c.id);
    });

    const grp = document.createElement('div');
    grp.className = 'btn-group';
    LABELS.forEach(([k, label]) => {
      const b = document.createElement('button');
      b.className = 'status-btn ' + k + (st === k ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => { answer(c.id, k); });
      grp.appendChild(b);
    });
    el.appendChild(grp);

    const r = rec[c.id];
    if (r && r.d) {
      const due = document.createElement('div');
      due.className = 'next-due';
      due.textContent = r.d <= today() ? '復習日：今日' : '次の復習：' + r.d.slice(5).replace('-', '/');
      el.appendChild(due);
    }
    return el;
  }

  function answer(id, k) {
    const prev = rec[id];
    if (prev && prev.s === k) { delete rec[id]; }
    else {
      let n = (k === 'maru') ? ((prev && prev.s === 'maru' ? (prev.n || 0) : 0) + 1) : 0;
      const days = (k === 'maru') ? INTERVALS.maru[Math.min(n - 1, INTERVALS.maru.length - 1)] : INTERVALS[k];
      rec[id] = { s: k, n: n, d: addDays(days) };
    }
    save(); render();
  }

  /* --- 一覧の描画 --- */
  function currentPool() {
    if (query) {
      const q = query.toLowerCase();
      const strip = h => h.replace(/<[^>]+>/g, '');
      return everyCard.filter(c => (strip(c.q) + strip(c.a.join('')) + strip(c.trap || '') + c.unitName).toLowerCase().includes(q));
    }
    const s = SUBJECTS[subjIdx];
    return unitIdx === -1 ? s.all : s.all.filter(c => c.ui === unitIdx);
  }

  function renderList() {
    let target = currentPool();
    if (!query) {
      if (filter === 'weak' || unitIdx === -1) target = target.filter(c => statusOf(c.id) !== 'maru');
      else if (filter === 'due') target = target.filter(isDue);
    }
    if (shuffle) {
      target = target.slice().sort((a, b) => (order[a.id] || 0) - (order[b.id] || 0));
    }

    listEl.innerHTML = '';
    const frag = document.createDocumentFragment();
    target.forEach(c => frag.appendChild(cardNode(c, unitIdx === -1 || !!query)));
    listEl.appendChild(frag);

    if (target.length === 0) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = query ? '「' + query + '」に一致するカードはありません。'
        : filter === 'due' ? '今日の復習はすべて終わりました。おつかれさまです。'
        : unitIdx === -1 || filter === 'weak' ? 'この範囲に苦手カードはありません。'
        : 'カードがありません。';
    } else emptyEl.style.display = 'none';
  }

  function tally(cards) {
    const c = { maru: 0, sankaku: 0, batsu: 0 };
    cards.forEach(x => { const s = statusOf(x.id); if (s) c[s]++; });
    c.none = cards.length - c.maru - c.sankaku - c.batsu; c.total = cards.length || 1;
    return c;
  }

  function renderStats() {
    const all = tally(everyCard);
    $('ovRate').textContent = Math.round(all.maru / all.total * 100) + '%';
    const s = SUBJECTS[subjIdx], t = tally(s.all);
    $('subjRate').textContent = Math.round(t.maru / t.total * 100) + '%';
    $('cMaru').textContent = t.maru; $('cSankaku').textContent = t.sankaku;
    $('cBatsu').textContent = t.batsu; $('cNone').textContent = t.none;
    $('barMaru').style.width = (t.maru / t.total * 100) + '%';
    $('barSankaku').style.width = (t.sankaku / t.total * 100) + '%';
    $('barBatsu').style.width = (t.batsu / t.total * 100) + '%';

    tabsEl.querySelectorAll('button').forEach((b, i) => {
      b.classList.toggle('active', i === subjIdx && !query);
      const st = tally(SUBJECTS[i].all);
      b.querySelector('.n').textContent = st.maru + '/' + st.total;
    });
    s.units.forEach((u, i) => {
      const done = u.cards.filter(x => statusOf(x.id) === 'maru').length;
      if (selEl.options[i]) selEl.options[i].textContent = u.unit + '（' + done + '/' + u.cards.length + '）';
    });
    const last = selEl.options[selEl.options.length - 1];
    if (last) last.textContent = '★ この科目の苦手を総復習（' + s.all.filter(x => statusOf(x.id) !== 'maru').length + '問）';
    $('dueCount').textContent = '(' + everyCard.filter(isDue).length + ')';
  }

  function render() { renderStats(); renderList(); }

  /* --- 操作 --- */
  document.querySelectorAll('#filterSeg button').forEach(b => {
    b.addEventListener('click', () => {
      filter = b.dataset.filter;
      document.querySelectorAll('#filterSeg button').forEach(x => x.classList.toggle('active', x === b));
      renderList();
    });
  });

  const searchEl = $('search');
  let sTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(sTimer);
    sTimer = setTimeout(() => {
      query = searchEl.value.trim();
      $('btnClear').style.display = query ? 'block' : 'none';
      render();
    }, 200);
  });
  $('btnClear').addEventListener('click', () => { searchEl.value = ''; query = ''; $('btnClear').style.display = 'none'; render(); });

  $('btnShuffle').addEventListener('click', () => {
    shuffle = !shuffle;
    $('btnShuffle').classList.toggle('on', shuffle);
    if (shuffle) everyCard.forEach(c => { order[c.id] = Math.random(); });
    renderList();
  });

  $('btnPrev').addEventListener('click', () => { if (unitIdx > 0) { unitIdx--; selEl.value = String(unitIdx); render(); savePref(); scrollTop(); } });
  $('btnNext').addEventListener('click', () => {
    if (unitIdx !== -1 && unitIdx < SUBJECTS[subjIdx].units.length - 1) { unitIdx++; selEl.value = String(unitIdx); render(); savePref(); scrollTop(); }
  });

  /* --- バックアップ／復元 --- */
  $('btnBackup').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ app: 'takken-recall', version: APP_VERSION, exportedAt: new Date().toISOString(), records: rec }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'takken-recall-' + today() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('バックアップを保存しました');
  });
  $('btnRestore').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        const r = d.records || d;
        if (typeof r !== 'object') throw new Error('形式が違います');
        rec = normalize(r); save(); render(); toast('記録を復元しました');
      } catch (err) { toast('ファイルを読み込めませんでした'); }
      e.target.value = '';
    };
    fr.readAsText(f);
  });

  $('btnReset').addEventListener('click', async () => {
    if (!confirm('全科目の◯△✕の記録を消します。よろしいですか？\n（先にバックアップを取ることをおすすめします）')) return;
    rec = {}; render();
    await store.del(STORAGE_KEY); toast('記録を消しました');
  });

  /* --- 保存・読込 --- */
  function normalize(obj) {
    const out = {};
    Object.keys(obj || {}).forEach(k => {
      const v = obj[k];
      if (typeof v === 'string') out[k] = { s: v, n: v === 'maru' ? 1 : 0, d: today() };   // 旧バージョンからの移行
      else if (v && v.s) out[k] = v;
    });
    return out;
  }
  async function save() { const ok = await store.set(STORAGE_KEY, JSON.stringify(rec)); if (!ok) toast('記録を保存できませんでした'); }
  async function savePref() { await store.set(PREF_KEY, JSON.stringify({ subjIdx, unitIdx })); }

  async function load() {
    const raw = await store.get(STORAGE_KEY);
    if (raw) { try { rec = normalize(JSON.parse(raw)); } catch (e) { rec = {}; } }
    const p = await store.get(PREF_KEY);
    if (p) {
      try {
        const o = JSON.parse(p);
        if (typeof o.subjIdx === 'number' && SUBJECTS[o.subjIdx]) subjIdx = o.subjIdx;
        if (typeof o.unitIdx === 'number') unitIdx = Math.min(o.unitIdx, SUBJECTS[subjIdx].units.length - 1);
        if (o.unitIdx === -1) unitIdx = -1;
      } catch (e) {}
    }
    buildUnitSelect(); render();
  }

  let tid;
  function toast(m) {
    const t = $('toast'); t.textContent = m; t.classList.add('show');
    clearTimeout(tid); tid = setTimeout(() => t.classList.remove('show'), 2400);
  }

  $('verLabel').textContent = 'v' + APP_VERSION + '｜全' + everyCard.length + '問｜保存先：' + (store.mode === 'claude' ? 'Claude' : 'このブラウザ');
  buildUnitSelect(); render(); load();
})();
</script>
</body>
</html>
